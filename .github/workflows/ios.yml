name: iOS build

# Compiles the Capacitor iOS app for the simulator (unsigned) to prove the
# Xcode project builds. Runs only when iOS-related files change, because
# macOS runner minutes cost more; run it by hand from the Actions tab too.
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/ios/**"
      - "frontend/capacitor.config.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build web app and sync into the iOS project
        run: npm run ios:sync

      - name: Build for the iOS simulator (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
